                    <div>

                        <p data-ru="Проект был посвящён разработке корпоративного сайта для компании, работающей в сфере кибербезопасности. Основной задачей стало создание современного и понятного интерфейса, который помогает потенциальным клиентам быстро разобраться в услугах компании, формирует доверие к бренду и упрощает поиск необходимой информации."
                            data-en="This project focused on designing a corporate website for a cybersecurity company. The primary goal was to create a modern, easy-to-navigate interface that clearly presents the company's services, builds trust, and helps potential clients quickly find relevant information.">

                        </p>

                    </div>

                </div>

            </div>

        <section class="challenge">

            <div class="container">

                <span class="section-label">

                    Challenge

                </span>

                <h2 data-ru="Проблема" data-en="The problem">

                    The Problem

                </h2>

                <p data-ru="Продукты и услуги в сфере информационной безопасности часто содержат большое количество технической информации, которую сложно воспринимать неподготовленным пользователям. Интерфейс должен был структурировать контент, снизить когнитивную нагрузку и сделать знакомство с компанией максимально понятным."
                    data-en="Cybersecurity services often involve large amounts of technical information that can be difficult for non-expert users to understand. The challenge was to organize complex content, reduce cognitive load, and make the company easier to understand and trust.">

                </p>

            </div>

        </section>

                        <h3 data-ru="Повысить доверие" data-en="Build Trust">

                        </h3>

                        <p data-ru="Создать современный визуальный образ компании и подчеркнуть её профессиональную экспертизу."
                            data-en="Create a professional visual identity that reinforces credibility and expertise.">

                        </p>

                    </div>

                    <div class="goal-card">

                        <h3 data-ru="Упростить навигацию" data-en="Simplify Navigation">

                        </h3>

                        <p data-ru="Организовать информацию так, чтобы пользователи быстро находили нужные услуги и разделы сайта."
                            data-en="Organize information so users can quickly find services and key sections of the website.">

                        </p>

                    </div>

                    <div class="goal-card">

                        <h3 data-ru="Сделать сложное понятным" data-en="Make Complexity Accessible">

                        </h3>

                        <p data-ru="Представить техническую информацию простым и структурированным способом без потери её смысла."
                            data-en="Present complex technical information in a clear and structured way without losing its meaning.">

                        </p>

                    </div>

                </div>

            </div>

        </section>

                            Overview

                        </h2>

                    </div>

                    <div>

                        <p data-ru="Работа началась с анализа целевой аудитории, структуры существующего сайта и конкурентной среды. Были изучены корпоративные сайты компаний в сфере кибербезопасности, чтобы определить распространённые паттерны навигации, способы представления услуг и визуальные решения, которые помогают формировать доверие."
                            data-en="The project started with researching the target audience, analyzing the existing website structure, and reviewing competitor websites. This helped identify common navigation patterns, content organization strategies, and visual approaches that strengthen user trust.">

                        </p><br>
                        <p data-ru="На основе анализа были определены ключевые пользовательские сценарии и сформирована информационная архитектура, позволяющая быстро переходить к наиболее востребованным разделам."
                            data-en="Based on this research, I identified key user journeys and designed an information architecture that provides quick access to the most important content.">

                        </p>

                    </div>

                </div>

            </div>

        </section>

                            data-en="The design process began with defining page structure and user flows. After creating wireframes, I developed a visual concept that communicates reliability and technological expertise. Special attention was given to readability, visual hierarchy, and responsive behavior.">

                        </p>

                    </div>

                </div>

                    </div>

                            data-en="Minimalist visuals, clean typography, and restrained accents create a sense of reliability and professionalism.">

                        </p>

                    </div>


                    <div class="goal-card">

                        <h3 data-ru="Удобство восприятия" data-en="Readable Content">

                        </h3>

                            data-en="Visual hierarchy, spacing, and structured layouts make large amounts of technical information easier to read and understand.">

                        </p>

                    </div>

                </div>

        </section>

                            data-en="This project strengthened my understanding of B2B interface design and the challenges of presenting complex technical information. A key takeaway was that a successful corporate website should not only present the company but also help users quickly find answers and build trust.">

                        </p><br>
                        <p data-ru="При дальнейшем развитии проекта следующим этапом стало бы проведение пользовательского тестирования, анализ поведения посетителей и оптимизация интерфейса на основе полученных данных."
                            data-en="If the project continued, the next step would be conducting usability testing, analyzing user behavior, and refining the interface based on real feedback.">

                        </p>
