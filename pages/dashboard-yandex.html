        <section class="overview" id="overview">

                <div class="overview-grid">

                    <div>

                        <h2 data-ru="О проекте" data-en="Overview">

                            Overview

                        </h2>

                    </div>

                    <div>

                        <p data-ru="Проект посвящён редизайну аналитического дашборда платформы A/B-тестирования. Основной задачей стало повышение удобства работы аналитиков с большим количеством метрик и срезов за счёт переработки структуры интерфейса, визуальной иерархии и сценариев взаимодействия."
                            data-en="This project focuses on redesigning an analytics dashboard for an A/B testing platform. The primary goal was to improve the experience of working with large datasets by redesigning the information structure, visual hierarchy, and interaction patterns.">
                        </p>

                    </div>

                </div>

            </div>

        </section>

        <section class="challenge">

            <div class="container">

                <span class="section-label">

                    Challenge

                </span>

                <h2 data-ru="Проблема" data-en="The problem">

                    The Problem

                </h2>

                <p data-ru="Исходный интерфейс содержал большое количество одновременно отображаемых метрик и срезов, из-за чего пользователям было сложно быстро находить нужную информацию и сравнивать результаты экспериментов. Недостаточная визуальная иерархия увеличивала когнитивную нагрузку и замедляла процесс анализа."
                    data-en="The original interface displayed a large number of metrics and dimensions simultaneously, making it difficult for analysts to quickly find relevant information and compare experiment results. The lack of clear visual hierarchy increased cognitive load and slowed down decision-making.">
                </p>

            </div>

        </section>

        <section class="goals">

            <div class="container">

                <h2 data-ru="Цели проекта" data-en="Goals">

                    Goals

                </h2>

                <div class="goals-grid">

                    <div class="goal-card">

                        <h3 data-ru="Снизить когнитивную нагрузку" data-en="Reduce Cognitive Load">

                        </h3>

                        <p data-ru="Сделать интерфейс более понятным за счёт переработки структуры отображения данных."
                            data-en="Make the interface easier to understand by restructuring how data is presented.">
                        </p>

                    </div>

                    <div class="goal-card">

                        <h3 data-ru="Упростить анализ" data-en="Improve Data Analysis">

                        </h3>

                        <p data-ru="Помочь аналитикам быстрее сравнивать результаты экспериментов и находить ключевые показатели."
                            data-en="Help analysts compare experiment results and identify key metrics more efficiently.">
                        </p>

                    </div>

                    <div class="goal-card">

                        <h3 data-ru="Дать пользователю контроль" data-en="Increase User Control">

                        </h3>

                        <p data-ru="Позволить пользователям самостоятельно выбирать необходимые метрики и срезы, скрывая второстепенные данные."
                            data-en="Allow users to choose which metrics and dimensions to display while hiding unnecessary information.">
                        </p>

                    </div>

                </div>

            </div>

        </section>

        <section class="overview" id="process">

            <div class="container">

                <div class="overview-grid">

                    <div>

                        <h2 data-ru="Исследование и анализ" data-en="Research">

                            Overview

                        </h2>

                    </div>

                    <div>

                        <p data-ru="Перед началом проектирования был проведён анализ существующего интерфейса, выделены основные проблемы, сформулированы пользовательские задачи (JTBD), гипотезы и критерии успешности решения. Это позволило определить, какие изменения действительно повлияют на удобство работы аналитиков."
                            data-en="Before redesigning the interface, I analyzed the existing dashboard, identified usability issues, defined JTBD scenarios, formulated design hypotheses, and established success criteria. This helped prioritize improvements that would have the greatest impact on analysts' workflow.">
                        </p><br>
                        <p data-ru="В качестве основных проблем были выделены перегруженность таблицы, отсутствие удобной фильтрации метрик, слабая визуальная иерархия и низкая масштабируемость интерфейса при увеличении количества тестовых групп."
                            data-en="The key issues included overloaded tables, insufficient metric filtering, weak visual hierarchy, and poor scalability when working with multiple experiment groups.">
                        </p>

                    </div>

                </div>

            </div>

        </section>

        <section class="overview" id="research">

            <div class="container">

                <div class="overview-grid">

                    <div>

                        <h2 data-ru="Процесс проектирования" data-en="Design Process">

                            Overview

                        </h2>

                    </div>

                    <div>

                        <p data-ru="После анализа проблем были сформированы несколько концепций решения. Основное внимание уделялось переработке структуры данных, созданию системы фильтрации, группировке метрик по категориям и улучшению визуальной иерархии интерфейса."
                            data-en="Following the research phase, I explored multiple design concepts. The main focus was restructuring information, introducing flexible filtering, grouping related metrics, and improving the visual hierarchy of the dashboard.">
                        </p>

                    </div>

                </div>

            </div>

        </section>

        <section class="goals">

            <div class="container">

                <h2 data-ru="Ключевые дизайн-решения" data-en="Key Design Decisions">

                    Goals

                </h2>

                <div class="goals-grid">

                    <div class="goal-card">
                        <h3 data-ru="Группировка метрик" data-en="Metric Grouping">

                        </h3>
                        <p data-ru="Метрики были объединены в логические категории и перенесены в фильтр, что позволило сократить количество одновременно отображаемых данных."
                            data-en="Metrics were organized into logical categories and moved into a dedicated filter, reducing information overload and making the interface easier to scan.">
                        </p>

                    </div>

                    <div class="goal-card">
                        <h3 data-ru="Гибкая фильтрация" data-en="Flexible Filtering">

                        </h3>

                        <p data-ru="Пользователь самостоятельно выбирает интересующие метрики, экспериментальные группы и срезы, формируя рабочее пространство под текущую задачу."
                            data-en="Users can select the metrics, experiment groups, and dimensions relevant to their current analysis, creating a personalized workspace.">
                        </p>

                    </div>
                    <div class="goal-card">
                        <h3 data-ru="Оптимизация таблицы" data-en="Optimized Table Layout">

                        </h3>
                        <p data-ru="Таблица автоматически адаптируется под выбранные показатели, сохраняя компактность и читаемость даже при работе с большим объёмом данных."
                            data-en="The table dynamically adapts to selected metrics while maintaining readability, even when displaying large datasets.">
                        </p>

                    </div>

                    <div class="goal-card">
                        <h3 data-ru="Визуальная иерархия" data-en="Visual Hierarchy">

                        </h3>
                        <p data-ru="Размеры элементов, интервалы и акценты помогают быстрее ориентироваться в информации и выделяют наиболее важные показатели."
                            data-en="Typography, spacing, and visual emphasis guide users toward the most important information and improve scanning efficiency.">
                        </p>

                    </div>
                </div>

        </section>

        <section class="overview" id="research">

            <div class="container">

                <div class="overview-grid">

                    <div>

                        <h2 data-ru="Итоги и&nbsp;выводы" data-en="Conclusions">

                            Overview

                        </h2>

                    </div>

                    <div>

                        <p data-ru="Работа над этим проектом помогла глубже разобраться в проектировании аналитических интерфейсов и особенностях взаимодействия пользователей с большими объёмами данных. Наиболее интересной частью стало определение того, какие данные действительно необходимы пользователю в каждый момент времени, а какие можно скрыть без потери эффективности."
                            data-en="This project strengthened my understanding of analytics dashboard design and the challenges of working with data-heavy interfaces. The most valuable part was identifying which information should always remain visible and which could be progressively disclosed.">
                        </p><br>
                        <p data-ru="При дальнейшем развитии проекта следующим этапом стали бы пользовательские интервью, проверка гипотез и юзабилити-тестирование для оценки эффективности предложенных изменений."
                            data-en="If the project continued, the next step would be validating the proposed solutions through user interviews and usability testing.">
                        </p>

                    </div>

                </div>

            </div>

        </section>
