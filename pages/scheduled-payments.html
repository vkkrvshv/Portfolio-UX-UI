        <section class="overview" id="overview">

                    <div>

                        <h2 data-ru="О проекте" data-en="Overview">

                            Overview

                        </h2>

                    </div>

                    <div>

                        <p data-ru="Проект выполнен в рамках тестового задания и посвящён проектированию сценария управления запланированными платежами в мобильном банковском приложении. Основная цель — сделать информацию о будущих списаниях более понятной, помочь пользователям контролировать регулярные платежи и снизить вероятность ошибок при управлении финансами."
                            data-en="This project was completed as part of a design challenge focused on designing the scheduled payments experience in a mobile banking application. The goal was to make upcoming transactions easier to understand, help users manage recurring payments, and reduce uncertainty when planning their finances.">

                        </p>

                    </div>

                </div>

            </div>

        </section>

        <section class="challenge">

            <div class="container">

                <span class="section-label">

                    Challenge

                </span>

                <h2 data-ru="Проблема" data-en="The problem">

                    The Problem

                </h2>

                <p data-ru="Пользователям бывает сложно отслеживать будущие списания и понимать, какие платежи уже запланированы. Недостаточная прозрачность интерфейса увеличивает когнитивную нагрузку, усложняет финансовое планирование и может приводить к неожиданным списаниям."
                    data-en="Users often struggle to keep track of upcoming transactions and understand which payments are already scheduled. Limited visibility increases cognitive load, makes financial planning more difficult, and may result in unexpected charges.">

                </p>

            </div>

        </section>

        <section class="goals">

            <div class="container">

                <h2 data-ru="Цели проекта" data-en="Goals">

                    Goals

                </h2>

                <div class="goals-grid">

                    <div class="goal-card">

                        <h3 data-ru="Повысить прозрачность" data-en="Increase Transparency">

                            Повысить прозрачность

                        </h3>

                        <p data-ru="Сделать информацию о будущих платежах понятной и легко доступной."
                            data-en="Present upcoming payments in a clear and accessible way.">

                        </p>

                    </div>

                    <div class="goal-card">

                        <h3 data-ru="Снизить вероятность ошибок" data-en="Reduce Errors">

                        </h3>

                        <p data-ru="Помочь пользователям понимать последствия своих действий ещё до подтверждения операции."
                            data-en="Help users understand the outcome of their actions before confirming a payment.">

                        </p>

                    </div>

                    <div class="goal-card">

                        <h3 data-ru="Упростить планирование" data-en="Support Financial Planning">

                        </h3>

                        <p data-ru="Создать интерфейс, который помогает контролировать регулярные платежи и эффективнее планировать личные финансы."
                            data-en="Create an interface that helps users manage recurring payments and plan their finances more confidently.">

                        </p>

                    </div>

                </div>

            </div>

        </section>

        <section class="overview" id="process">

            <div class="container">

                <div class="overview-grid">

                        <h2 data-ru="Исследование и анализ" data-en="Research">

                            Overview

                        </h2>

                    </div>

                    <div>

                        <p data-ru="Перед началом проектирования я изучила сценарий использования, выделила ключевые пользовательские задачи и проанализировала существующий интерфейс. Основное внимание было уделено моментам, в которых пользователи могут испытывать неопределённость при работе с будущими платежами."
                            data-en="Before designing the interface, I analyzed the user flow, identified key user tasks, and reviewed the existing experience. Special attention was given to situations where users might feel uncertain about upcoming transactions.">

                        </p><br>
                        <p data-ru="На основе анализа были сформированы основные принципы будущего решения: прозрачность информации, предсказуемость действий и снижение когнитивной нагрузки."
                            data-en="Based on this analysis, I defined three design principles: information transparency, predictable interactions, and reduced cognitive load.">

                        </p>

                    </div>

                </div>

            </div>

        </section>

                            Overview

                        </h2>

                    </div>

                    <div>

                        <p data-ru="Работа над интерфейсом началась с анализа сценариев и определения структуры информации. Затем были разработаны wireframes, после чего я перешла к созданию визуальной концепции и проработке состояний интерфейса. Особое внимание уделялось понятной навигации, визуальной иерархии и единообразию компонентов."
                            data-en="The project began with analyzing user scenarios and defining the information structure. After creating wireframes, I developed the visual interface and refined different UI states. Particular attention was paid to navigation, visual hierarchy, and component consistency.">

                        </p>

                    </div>

                </div>

            </div>

                    <div class="goal-card">

                        <h3 data-ru="Прозрачность платежей" data-en="Payment Visibility">

                        </h3>

                        <p data-ru="Будущие платежи представлены таким образом, чтобы пользователь мог быстро понять дату, сумму и статус каждой операции."
                            data-en="Upcoming payments are displayed clearly, allowing users to quickly understand dates, amounts, and payment status.">

                        </p>

                    </div>

                    <div class="goal-card">

                        <h3 data-ru="Предсказуемые действия" data-en="Predictable Interactions">

                        </h3>

                        <p data-ru="Каждое действие сопровождается понятной обратной связью, снижая вероятность случайных ошибок."
                            data-en="Every interaction provides clear feedback, reducing the likelihood of accidental mistakes.">

                        </p>

                    </div>

                    <div class="goal-card">

                        <h3 data-ru="Визуальная иерархия" data-en="Visual Hierarchy">

                        </h3>

                        <p data-ru="Типографика, цветовые акценты и интервалы помогают быстро ориентироваться в информации и выделяют наиболее важные данные."
                            data-en="Typography, spacing, and color accents guide users' attention toward the most important information.">

                        </p>

                    </div>

                </div>

        </section>

                            Overview

                            data-en="This project deepened my understanding of financial product design and recurring payment flows. The most valuable challenge was creating an interface that reduces uncertainty and helps users feel more confident when managing their finances.">

                        </p><br>
                        <p data-ru="Если бы проект получил дальнейшее развитие, следующим этапом стали бы пользовательские интервью и юзабилити-тестирование для проверки сформулированных гипотез и оценки эффективности предложенных решений."
                            data-en="If the project continued, the next step would be validating design hypotheses through user interviews and usability testing to evaluate the effectiveness of the proposed solution.">

                        </p>
